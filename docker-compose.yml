version: '3.8'

services:
  titan-backend:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - titan-network

  titan-hardware-node:
    build:
      context: .
      dockerfile: Dockerfile.python
    env_file:
      - .env
    environment:
      # This forces Python to talk to the Node container, not itself
      - API_URL=http://titan-backend:5000/api/telemetry/ingest
    depends_on:
      - titan-backend
    restart: unless-stopped
    networks:
      - titan-network

networks:
  titan-network:
    driver: bridge